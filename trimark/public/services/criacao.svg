<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-label="Criação e Conteúdo — branding, design e produção de conteúdo">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F5F7FC"/><stop offset="1" stop-color="#E9EEF9"/>
    </linearGradient>
    <linearGradient id="navy2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B2D5C"/><stop offset="1" stop-color="#2A4280"/>
    </linearGradient>
  </defs>
  <rect width="800" height="480" rx="24" fill="url(#bg2)"/>
  <circle cx="110" cy="80" r="100" fill="#FA7415" opacity="0.07"/>
  <circle cx="720" cy="410" r="120" fill="#1B2D5C" opacity="0.05"/>

  <!-- prancheta / artboard -->
  <rect x="170" y="70" width="330" height="330" rx="18" fill="#FFFFFF" stroke="#DCE4F5" stroke-width="2"/>
  <rect x="200" y="104" width="160" height="26" rx="13" fill="#1B2D5C"/>
  <rect x="200" y="146" width="270" height="12" rx="6" fill="#C7D3EE"/>
  <rect x="200" y="170" width="230" height="12" rx="6" fill="#E3E9F5"/>

  <!-- moldura de imagem -->
  <rect x="200" y="210" width="270" height="150" rx="12" fill="#E9EEF9"/>
  <circle cx="245" cy="255" r="18" fill="#FA7415"/>
  <path d="M200 340 L280 272 L330 316 L380 262 L470 340 L470 348 A12 12 0 0 1 458 360 L212 360 A12 12 0 0 1 200 348 Z" fill="#3D5590"/>

  <!-- tipografia Aa -->
  <g transform="translate(590,120)">
    <rect x="-58" y="-52" width="116" height="104" rx="16" fill="url(#navy2)"/>
    <text x="0" y="20" font-family="Georgia, 'Times New Roman', serif" font-size="58" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Aa</text>
  </g>

  <!-- paleta de cores -->
  <g transform="translate(560,230)">
    <rect width="180" height="56" rx="14" fill="#FFFFFF" stroke="#DCE4F5" stroke-width="2"/>
    <circle cx="34" cy="28" r="15" fill="#1B2D5C"/>
    <circle cx="74" cy="28" r="15" fill="#3D5590"/>
    <circle cx="114" cy="28" r="15" fill="#FA7415"/>
    <circle cx="150" cy="28" r="15" fill="#E3E9F5" stroke="#C7D3EE" stroke-width="2"/>
  </g>

  <!-- caneta / pen tool -->
  <g transform="translate(640,360) rotate(40)">
    <rect x="-11" y="-72" width="22" height="106" rx="10" fill="#1B2D5C"/>
    <path d="M-11 34 L0 66 L11 34 Z" fill="#FA7415"/>
    <rect x="-11" y="14" width="22" height="10" fill="#FFFFFF" opacity="0.35"/>
  </g>

  <!-- curva bezier decorativa -->
  <path d="M90 380 C 160 300, 240 440, 330 430" fill="none" stroke="#FA7415" stroke-width="5" stroke-linecap="round" stroke-dasharray="1 14"/>
  <circle cx="90" cy="380" r="8" fill="#1B2D5C"/>
  <circle cx="330" cy="430" r="8" fill="#FA7415"/>

  <!-- coração de engajamento -->
  <g transform="translate(120,220)">
    <rect x="-34" y="-34" width="68" height="68" rx="16" fill="#FFFFFF" stroke="#DCE4F5" stroke-width="2"/>
    <path d="M0 14 C -22 -4 -14 -26 0 -14 C 14 -26 22 -4 0 14 Z" fill="#FA7415"/>
  </g>
</svg>
