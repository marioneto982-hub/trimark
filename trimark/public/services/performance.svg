<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-label="Performance e Mídia — tráfego pago, SEO e crescimento">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F5F7FC"/><stop offset="1" stop-color="#E9EEF9"/>
    </linearGradient>
    <linearGradient id="navy3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B2D5C"/><stop offset="1" stop-color="#2A4280"/>
    </linearGradient>
  </defs>
  <rect width="800" height="480" rx="24" fill="url(#bg3)"/>
  <circle cx="700" cy="90" r="110" fill="#FA7415" opacity="0.07"/>
  <circle cx="80" cy="100" r="90" fill="#1B2D5C" opacity="0.05"/>

  <!-- funil -->
  <g transform="translate(150,110)">
    <path d="M0 0 L180 0 L145 74 L35 74 Z" fill="#1B2D5C"/>
    <path d="M35 86 L145 86 L122 160 L58 160 Z" fill="#3D5590"/>
    <path d="M58 172 L122 172 L104 246 L76 246 Z" fill="#FA7415"/>
    <circle cx="90" cy="290" r="16" fill="#22C55E"/>
    <path d="M83 290 l5 6 l10 -12" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- gráfico de crescimento -->
  <rect x="400" y="120" width="310" height="240" rx="18" fill="#FFFFFF" stroke="#DCE4F5" stroke-width="2"/>
  <line x1="432" y1="330" x2="682" y2="330" stroke="#E3E9F5" stroke-width="2"/>
  <line x1="432" y1="286" x2="682" y2="286" stroke="#E3E9F5" stroke-width="2"/>
  <line x1="432" y1="242" x2="682" y2="242" stroke="#E3E9F5" stroke-width="2"/>
  <line x1="432" y1="198" x2="682" y2="198" stroke="#E3E9F5" stroke-width="2"/>
  <path d="M432 320 C 490 315, 510 275, 555 255 C 600 235, 620 200, 668 168" fill="none" stroke="#1B2D5C" stroke-width="6" stroke-linecap="round"/>
  <path d="M668 168 l-22 2 M668 168 l-4 21" stroke="#1B2D5C" stroke-width="6" stroke-linecap="round"/>
  <circle cx="555" cy="255" r="8" fill="#FA7415"/>
  <rect x="518" y="152" width="88" height="34" rx="10" fill="#FA7415"/>
  <text x="562" y="175" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">ROAS</text>

  <!-- megafone -->
  <g transform="translate(120,400) rotate(-18)">
    <path d="M-10 -26 L54 -46 L54 26 L-10 6 Z" fill="url(#navy3)"/>
    <rect x="-42" y="-24" width="36" height="28" rx="8" fill="#1B2D5C"/>
    <rect x="-34" y="4" width="18" height="30" rx="8" fill="#3D5590"/>
    <path d="M64 -34 q 26 14 0 30" fill="none" stroke="#FA7415" stroke-width="6" stroke-linecap="round"/>
    <path d="M74 -48 q 44 24 0 56" fill="none" stroke="#FA7415" stroke-width="6" stroke-linecap="round" opacity="0.55"/>
  </g>

  <!-- cursor clique -->
  <g transform="translate(470,395)">
    <circle r="20" fill="#FA7415" opacity="0.2"/>
    <path d="M-4 -12 L10 12 L2 12 L6 22 L0 24 L-4 14 L-10 18 Z" fill="#1B2D5C"/>
  </g>

  <!-- moedas -->
  <g transform="translate(660,408)">
    <ellipse cx="0" cy="10" rx="26" ry="10" fill="#C7D3EE"/>
    <ellipse cx="0" cy="2" rx="26" ry="10" fill="#8FA5D6"/>
    <ellipse cx="0" cy="-6" rx="26" ry="10" fill="#FA7415"/>
    <text x="0" y="-2" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">$</text>
  </g>
</svg>
